name: Release Skill

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/**'
      - '!scripts/**'
      - '!README.md'
  workflow_dispatch:

# One run at a time on main, so two quick merges don't both bump and race on push.
concurrency:
  group: release-skill
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A skill that changed without its own version bump gets a patch bump here,
      # so installed copies see the update (version_check.py compares versions).
      - name: Bump versions that were not bumped
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          bumped=$(python3 scripts/auto_bump_versions.py "${{ github.event.before }}" "${{ github.sha }}")
          if [ -z "$bumped" ]; then
            echo "Every changed skill already has a new version."
            exit 0
          fi
          echo "Bumped: $bumped"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A -- $(for f in $bumped; do dirname "$f"; done)
          git commit -m "chore: bump skill version(s) [auto]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Check whether the transcription skill changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only "${{ github.event.before }}" HEAD | grep -q '^transcription-speech-to-text-hebrew/'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Packages the working tree, so the zip already has the bumped version.
      - name: Package skill
        if: steps.changed.outputs.release == 'true'
        run: |
          cd transcription-speech-to-text-hebrew
          zip -r ../transcription-speech-to-text-hebrew.skill . \
            --exclude "*.pyc" \
            --exclude "*/__pycache__/*" \
            --exclude "*/.DS_Store"

      - name: Create or update latest release
        if: steps.changed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest transcription-speech-to-text-hebrew.skill \
            --title "Latest Skills" \
            --notes "Auto-updated on every push to main." \
            --latest
